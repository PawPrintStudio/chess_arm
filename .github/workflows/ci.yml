# CI: every push/PR must build, pass lint, pass the mock-hardware smoke test
# and the chess unit tests. Same sequence a member runs in the devcontainer,
# executed inside the plain `ros:humble` image so CI stays lean (no GUI
# stack) and honest (no devcontainer-only magic).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-smoke:
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: Vendor import (ur7e.repos)
        # The UR+RG2 packages aren't vendored in-tree — pulled at build time
        # same as any other dependency, see ur7e.repos and
        # scripts/vendor_import.sh. libnet1-dev is the one apt dep those
        # vendored packages need that isn't resolvable from their own
        # package.xml (see the script's comment).
        run: |
          apt-get update
          apt-get install -y python3-vcstool git libnet1-dev stockfish python3-pip
          bash scripts/vendor_import.sh
          pip3 install "pytest>=7,<9" "chess>=1.10"

      - name: Install dependencies (rosdep)
        # rosdep reads our package.xml files and apt-installs whatever they
        # declare (ur_robot_driver, ros2controlcli, lint tools) — so the CI
        # dependency list can never drift from the packages' own manifests.
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Lint (colcon test)
        # --packages-skip: the vendored packages (src/vendor, ur7e.repos)
        # are third-party code we don't own and can't fix lint failures in —
        # only our own packages' style is ours to hold to a standard.
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --packages-skip \
            onrobot_description onrobot_driver ur_onrobot_description \
            ur_onrobot_control ur_onrobot_moveit_config
          colcon test-result --verbose

      - name: Guard against silent test-collection loss
        # `colcon test` exits 0 when a package collects NO tests, so a broken
        # test file can silently disable a whole suite while CI stays green.
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          failed = False
          for path in sorted(glob.glob('build/*/pytest.xml')):
              root = ET.parse(path).getroot()
              suites = root.iter('testsuite') if root.tag != 'testsuite' else [root]
              total = skipped = 0
              for suite in suites:
                  total += int(suite.get('tests', 0))
                  skipped += int(suite.get('skipped', 0))
              ran = total - skipped
              print(f'{path}: {total} collected, {skipped} skipped, {ran} ran')
              if ran == 0:
                  print(f'::error::{path} ran no tests — collection is broken.')
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Mock-hardware smoke test
        shell: bash
        run: bash scripts/tier1_smoke_test.sh

      - name: Chess tests (no hardware)
        # The same command docs/JETSON.md step 7 runs on the robot computer.
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cd scripts
          PYTHONPATH=$PYTHONPATH:../src/ur7e_perception python3 -m pytest -q \
            -p no:launch_testing -p no:launch_ros \
            test_lab_chess.py test_chess_operator.py test_chess_vision.py \
            test_chess_gestures.py test_chess_voice.py test_lab_tooling.py
